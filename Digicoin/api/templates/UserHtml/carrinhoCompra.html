{% extends "base.html" %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/UserCss/carrinhoCompra.css' %}">

<div class="body-carrinhoCompras">
  {% include "components/user/menuUser.html" %}
  <div class="containerPrincipal-carrinhoCompras">
    <div class="containerSecundaria-carrinhoCompras">
      <div class="titulo-carrinhoCompras">
        <div class="icone-carrinhoCompras">
          <img src="{% static 'img/carrinho.png' %}" alt="Carrinho">
        </div>
        Carrinho de Compras
      </div>
      {% csrf_token %}
      
      <div class="itemGridHeader">
        <div class="itemGridCell col-produto"><img class="iconeProduto-carrinhoCompras" src="{%static 'img/produto.png'%}" alt="produtos">Produto<img id="btOrdenar"
              data-valor="nomeProduto" class="sort-asc" src="{%static 'img/sort.png'%}" alt="sort"></div>
        <div class="itemGridCell col-valor">Valor<img id="btOrdenar" data-valor="valorProduto" class="sort-asc"
                src="{%static 'img/sort.png'%}" alt="sort"></div>
        <div class="itemGridCell col-acoes">Ações</div>
      </div>

      <div class="itensGrid" id="itensGrid">
        <!-- Os itens serão inseridos aqui pelo JavaScript -->
      </div>
      <div class="valorTotal-carrinhoCompras">
        <h4>Total de Digicoins: <span id="valorTotal">0</span></h4>
        <a href="{% url 'listaProdutos' %}" class="checkoutButton-carrinhoCompras">Continuar Comprando</a>
        <button id="botaoFinalizarPedido" class="checkoutButton-carrinhoCompras">Finalizar Pedido</button>
      </div>
    </div>
  </div>
  <script>
    const imgRemoverSrc = "{% static 'img/remover.png' %}";
    const imgFecharPopupSrc = "{% static 'img/bt_closed.png' %}";
    const cssPopup = "{% static 'css/UserCss/popUp.css' %}";
  </script>
  <script type="module" src="{% static 'js/UserJs/carrinhoCompra.js' %}"></script>
  <script type="module" src="{% static 'js/UserJs/finalizarCompra.js' %}"></script>
</div>

</html>

{% endblock %}
