{% extends "base.html" %}
{% load static %}
{% block content %}
{% include 'components/adm/menuAdm.html' %}


<link rel="stylesheet" href="{% static 'css/AdmCss/relatorio.css' %}">
<div class="container">
    <div class="cabecalho">
        <div class="cabecalho_titulo">
            <h1>Relatórios</h1>
            <div class="linha"></div>
        </div>
        <div class="cabecalho_btnexportar">           
            <button id="exportButton"><img src="{% static 'img/export.png' %}" alt="Exportar">Exportar</button>
        </div>
    </div>
    <div class="relatorio">
        <table class="tabela_relatorio">
            <tr>
                <td class="tabela_relatorio_conteudo">
                    <div class="tabela_relatorio_conteudo_checkbox">
                        <input type="checkbox" id="vendasCheckbox" name="checkbox" />
                        <label for="vendasCheckbox"></label>
                    </div>
                    <div class="tabela_relatorio_conteudo_dado">
                        <img src="{% static 'img/relatorio.png' %}" alt="Relatório">
                        <h2>Vendas</h2>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>

<script>
    document.getElementById('exportButton').addEventListener('click', function() {
        var vendasChecked = document.getElementById('vendasCheckbox').checked;

        if (vendasChecked) {
            window.location.href = '/api/exportar_vendas_excel/';
        } else {
            alert('Por favor, selecione uma opção para exportar.');
        }
    });
</script>

{% endblock content %}
