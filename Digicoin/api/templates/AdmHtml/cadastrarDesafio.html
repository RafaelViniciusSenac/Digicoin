
    {% extends "base.html" %}
    {% load static %}
    {% block content %}
   
    <link rel="stylesheet" href="{% static 'css/AdmCss/cadastrarDesafio.css'%}">
    <div class='body'>
    <div class="header">
        <img src="{% static 'img/logoAdmin.png' %}" alt="LogoAdmin">
        <div class="botao">
            
            <img class="iconeX" id='iconeX' src="{% static 'img/iconeX.png' %}" alt="">
        </div>
    </div>

    <form method="POST"  id="formDesafio" class="formDesafio">
        {% csrf_token %}

        <div class="form">
            <div class="cima">
                <div class='inputsNome'>
                    <div class="nomeDesafioDiv">
                        <label for="">Nome do desafio</label>
                        <input type="text" id="nomeDesafio-form" class="nomeDesafio" placeholder="nome do desafio" >
                    </div>
                    <div class="nomeDesafioDiv">
                        <label for="">Valor do desafio</label>
                        <input type="number" id="valorDesafio-form" class="valorDesafio" placeholder="valor do desafio" >
                    </div>
                </div>
    
                <div class="descricaoDesafioDiv">
                    <label for="">Descrição</label>
                    <textarea id="descricao-form" class="descricao" placeholder="Digite a descrição do desafio"></textarea>
                </div>
            </div>
    
            <div class="baixo">
                <div class="statusDesafioDiv">
                    <label for="">Status do desafio</label>
                    <select name="campanha" id="campanha-form">
                        {% if desafio.idCampanha == None %}
                        <option value="">Sem Campanha</option>
                        {% else %}
                        <option value="{{ desafio.idCampanha }}">{{ desafio.idCampanha }}</option>
                        {% endif %}
    
                        {% for campanha in campanhas %}
                        <option value="{{ campanha.id }}">{{ campanha.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
    
                <div class="dataDesafioDiv">
                    <div class="dataDesafioInterno">
                        <label class="dataDesafio" for="">Início</label>
                        <input type="date" id="inicioDesafio-form">
                    </div>
                    <div class="dataDesafioInterno">
                        <label class="dataDesafio" for="">Fim</label>
                        <input type="date" id="fimDesafio-form">
                    </div>
                </div>
            </div>
        </div>
        <button type="submit" class="cadastrarDesafio">Concluído</button>
    </form>
    
 
</div>
<script src="{% static 'js/AdmJS/cadastrarDesafio.js' %}"> </script>
{% endblock content %}
